# Sparky OCR — DGX Spark (ARM64 / Grace Blackwell) deployment
#
# Host layout (exact mounts required for isolation):
#   /home/havran/Projects/Sparky_OCR/uploads  -> /app/uploads
#   /home/havran/Projects/Sparky_OCR/converted -> /app/converted
#   /home/havran/models/Sparky_OCR            -> /app/models_cache
#
# Networking: ONLY port 8501 (host 8000 is occupied). Binds 0.0.0.0 for Tailscale.

services:
  sparky-ocr:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Multi-arch NGC tag with linux/arm64 support (Grace Blackwell)
        NGC_PYTORCH_TAG: "26.07-py3"
    image: sparky-ocr:latest
    container_name: sparky-ocr
    restart: unless-stopped

    # NVIDIA Container Toolkit — expose all GPUs (unified memory on Spark)
    gpus: all

    environment:
      TZ: Europe/Bratislava
      APP_ROOT: /app
      UPLOADS_DIR: /app/uploads
      CONVERTED_DIR: /app/converted
      MODELS_CACHE_DIR: /app/models_cache
      HF_HOME: /app/models_cache
      TORCH_HOME: /app/models_cache
      XDG_CACHE_HOME: /app/models_cache
      TRANSFORMERS_CACHE: /app/models_cache
      HUGGINGFACE_HUB_CACHE: /app/models_cache/hub
      HF_HUB_CACHE: /app/models_cache/hub
      OCR_ENGINE: auto
      ACCELERATOR_DEVICE: AUTO
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      # Streamlit bind (also passed on CLI for certainty)
      STREAMLIT_SERVER_ADDRESS: "0.0.0.0"
      STREAMLIT_SERVER_PORT: "8501"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
      STREAMLIT_SERVER_HEADLESS: "true"

    ports:
      # Exclusive mapping — do not use 8000 on this host
      - "8501:8501"

    volumes:
      - /home/havran/Projects/Sparky_OCR/uploads:/app/uploads
      - /home/havran/Projects/Sparky_OCR/converted:/app/converted
      - /home/havran/models/Sparky_OCR:/app/models_cache

    # Hardened defaults: no new privileges; drop dangerous caps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - FOWNER
      - DAC_OVERRIDE

    # Read-only root FS would break pip/model writes inside /tmp & caches;
    # models are already redirected to the mounted volume. Keep writable root
    # for Streamlit/runtime temp files, but constrain tmpfs sizes.
    tmpfs:
      - /tmp:size=512m,mode=1777

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

    command:
      [
        "streamlit",
        "run",
        "app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501",
        "--server.headless=true",
        "--browser.gatherUsageStats=false",
      ]
